<text x="82" y="166" class="h1 dark">언어 알아보기 — 왜 11개 언어인가?</text>
<text x="84" y="216" class="body muted">입력 유형에 맞는 판별 규칙을 적용하고, 자동 감지는 후보를 좁혀 제안한 뒤 사용자가 최종 확인한다.</text>


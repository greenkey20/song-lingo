<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
<title id="title">언어 알아보기 — 왜 11개 언어인가?</title>
<desc id="desc">Song Lingo의 11개 언어 구성과 Whisper 언어 감지 후보 제한 실험. 문자 체계 기반 세 언어, 라틴 문자 기반 일곱 언어, 텍스트 직접 선택 한 언어로 구성된다.</desc>
<defs>
  <style>
    text { font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; }
    .ink { fill:#0b0b0b; } .dark { fill:#0d3b22; } .green { fill:#1a9f4c; }
    .muted { fill:#5f6b63; } .pale { fill:#e8f6ec; } .line { stroke:#e3e8e4; stroke-width:2; }
    .h1 { font-size:54px; font-weight:700; } .h2 { font-size:30px; font-weight:700; }
    .body { font-size:22px; } .small { font-size:17px; } .tiny { font-size:14px; }
    .bold { font-weight:700; }
  </style>
</defs>
